name: Build igxtulGram Telegram

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: igxtulgram-telegram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
